# GraphQL steps, against the demo API in crates/engine/examples/demo_api.rs:
#   cargo run -p stormix-engine --example demo_api
#   cargo run -p stormix-cli -- run examples/graphql.stormix.yaml
version: 1
flow:
  name: Demo API GraphQL
  variables:
    base_url: http://127.0.0.1:3999
    user_id: "7"
  steps:
    # `{{user_id}}` is text, but the query declares `$id: Int!`, so it is sent
    # as the number 7.
    - name: Get a user
      request:
        method: POST
        url: "{{base_url}}/graphql"
        body:
          graphql:
            query: |
              query User($id: Int!) {
                user(id: $id) { id name }
              }
            variables: { id: "{{user_id}}" }
      extract:
        name: { json: $.data.user.name }
      assert:
        - status: 200
        - json: { path: $.data.user.name, equals: Ada }
    # Variables can also be JSON text, filled in before it is parsed, as
    # Postman and Bruno keep them.
    - name: Get a user, variables as text
      request:
        method: POST
        url: "{{base_url}}/graphql"
        body:
          graphql:
            query: "query ($id: Int!) { user(id: $id) { name } }"
            variables: '{ "id": {{user_id}} }'
      assert:
        - json: { path: $.data.user.name, equals: "{{name}}" }
    # A response with `errors` fails the step, unless errors are expected.
    - name: An unknown user is an error
      request:
        method: POST
        url: "{{base_url}}/graphql"
        body:
          graphql:
            query: "query ($id: Int!) { user(id: $id) { name } }"
            variables: { id: 404 }
            allow_errors: true
      assert:
        - json: { path: "$.errors[0].message", equals: no such user }
