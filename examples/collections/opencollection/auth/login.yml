info:
  name: Log in
  type: http
  seq: 1
http:
  method: POST
  url: "{{base_url}}/login"
  body:
    type: json
    data: |-
      {
        "user": "{{user}}",
        "password": "{{password}}"
      }
runtime:
  variables:
    - name: password
      value: secret
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.token
      operator: isString
  scripts:
    - type: tests
      code: |-
        test("token is for the user", function () {
          expect(res.getBody().token).to.equal("tok-" + bru.getVar("user"));
        });
