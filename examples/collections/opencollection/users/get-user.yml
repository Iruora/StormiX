info:
  name: Get a user
  type: http
  seq: 1
http:
  method: GET
  url: "{{base_url}}/users/:id"
  params:
    - name: id
      value: "7"
      type: path
runtime:
  scripts:
    - type: after-response
      code: bru.setVar("userName", res.body.name);
    - type: tests
      code: |-
        test("is Ada", function () {
          expect(res.getStatus()).to.equal(200);
          expect(bru.getVar("userName")).to.equal("Ada");
        });
