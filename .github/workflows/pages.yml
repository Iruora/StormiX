name: Docs site

# Builds the website in docs/ (VitePress) and publishes it on GitHub Pages.
# Pull requests only build it, so broken links fail before they merge.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - CHANGELOG.md
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - CHANGELOG.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # for "last updated" dates
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build
        run: pnpm build
        working-directory: docs
        env:
          # Project sites are served under /<repository>/.
          DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
