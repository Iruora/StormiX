name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check TypeScript bindings are up to date
        run: |
          cargo test -p stormix-desktop export_bindings
          git diff --exit-code apps/desktop/src/bindings.ts
      - run: pnpm typecheck
        working-directory: apps/desktop
      - name: Check the example test file
        run: cargo run -q -p stormix-cli -- validate --strict examples/login.stormix.yaml

  demo:
    name: Run the demo flow and fixture collections
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p stormix-cli
      - run: cargo build -p stormix-engine --example demo_api
      - name: Start the demo API
        run: |
          ./target/debug/examples/demo_api &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3999/health > /dev/null && break; sleep 1; done
      - name: Run examples/demo-api.stormix.yaml
        run: ./target/debug/stormix run examples/demo-api.stormix.yaml --verbose --junit junit/test-file.xml
      - name: Run the Postman collection unchanged
        if: always()
        run: ./target/debug/stormix run examples/collections/demo-api.postman_collection.json --verbose --junit junit/postman.xml
      - name: Run the Bruno collection unchanged
        if: always()
        run: ./target/debug/stormix run examples/collections/bruno --env local --verbose --junit junit/bruno.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stormix-junit
          path: junit/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Test and build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: cargo test --workspace
      - name: Build the CLI
        run: cargo build --release -p stormix-cli
      - name: Build the app and installers
        run: pnpm tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: stormix-${{ runner.os }}
          path: |
            target/release/bundle/
            target/release/stormix
            target/release/stormix.exe
          if-no-files-found: error
          retention-days: 14
